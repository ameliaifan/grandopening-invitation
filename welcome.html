<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Crowd Mahjong Club</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="welcome-page">
      <section class="welcome-content">
        <div class="brand-logo">
          <img src="assets/TCMC Logo.png" alt="The Crowd Mahjong Club" />
        </div>

        <p class="eyebrow">YOU ARE CORDIALLY INVITED</p>

        <h1>THE CROWD<br /><span>MAHJONG CLUB</span></h1>

        <p class="tagline">Come for the game, stay for the crowd.</p>

        <div class="divider"></div>

        <p class="welcome-description">
          Sebuah undangan. Sebuah tantangan.<br />
          Berhasilkah kamu membuka undangannya?
        </p>

        <button type="button" id="start-button">
          MULAI TANTANGAN <span aria-hidden="true">→</span>
        </button>

        <p class="bottom-note">A NEW WAY TO PLAY</p>
      </section>
    </main>
    <script src="welcome.js"></script>
